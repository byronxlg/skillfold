# This repo's own manifest. Only the repo-specific blog skill and the
# conventions rule are installed; the generic library skills were removed
# 2026-09-15 (management knowledge audit: generic dev practice does not
# belong in one project). Run "skillfold install" (or npx tsx src/cli.ts
# install) after cloning.

# Dogfood all supported tools: Claude Code, Codex, and Cursor.
targets: [claude, codex, cursor]

skills:
  # Repo-specific, not part of the published library: drives the weekly
  # blog automation in .github/workflows/blog-post.yml.
  blog-post: ./skills/blog-post

rules:
  skillfold-conventions: ./rules/skillfold-conventions.md
